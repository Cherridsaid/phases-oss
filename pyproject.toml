[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phases-oss"
version = "0.1.0"
description = "A phase-based workflow runner for AI coding agents: bounded phases, deterministic proofs, and a consultative reviewer. Pure Python standard library, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "S. Cherrid" }]
keywords = ["ai-agents", "workflow", "code-review", "guardrails", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Cherridsaid/phases-oss"
Issues = "https://github.com/Cherridsaid/phases-oss/issues"

[project.scripts]
phases = "phases_oss.phases:main"
phases-multidim = "phases_oss.multidim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

name: publish

# Publishes to PyPI when a GitHub release is published, using Trusted
# Publishing (OIDC). No API token exists anywhere: not in the repository, not
# in the secrets, not on a laptop. PyPI verifies the workflow identity itself.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   PyPI project name : phases-oss
#   Owner             : Cherridsaid
#   Repository name   : phases-oss
#   Workflow filename : publish.yml
#   Environment       : (leave empty)

on:
  release:
    types: [published]
  # Manual trigger. A release runs the workflows as they existed *at its tag*,
  # so a release tagged before this file was added can never trigger it. Rather
  # than move a published tag, publish that one by hand from the default branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tests are the gate, not a formality: nothing is published from a
      # tree that cannot prove itself, package safety gate included.
      - name: Full test suite
        run: python run_tests.py

      - name: Build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the metadata renders
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only privilege this job needs: mint a short-lived OIDC token that
      # PyPI trades for an upload grant. Nothing long-lived is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned to the commit behind v1.14.2 (published 2026-07-29), not to a
      # moving tag: a tag can be repointed, a commit SHA cannot.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

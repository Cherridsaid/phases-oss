name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests (stdlib only)
        run: python run_tests.py
      - name: Install the PEP 517 build frontend for the smoke test
        run: python -m pip install --upgrade build
      - name: Packaging smoke test (wheel build + install + entry points)
        run: python smoke_install.py
